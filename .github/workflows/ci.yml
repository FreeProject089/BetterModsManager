name: CI

# Quality gate on every push / PR: catches the exact regressions we kept hitting
# by hand (typecheck, security-guard, i18n parity, fmt, clippy). Split into a fast
# frontend job (Linux) and the Rust job (Windows — BMM's Tauri target).

on:
  push:
    branches: [main, Tdev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc · guard · i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: BetaHub local config (CI stub from example)
        # betahub-config.local.ts is gitignored; the example provides the same
        # exports so tsc can resolve the module (values are irrelevant for CI).
        run: cp frontend/src/features/betahub/betahub-config.example.ts frontend/src/features/betahub/betahub-config.local.ts
      - name: Security guard (no eval / new Function)
        run: node scripts/security-guard.mjs
      - name: i18n parity (en === fr)
        run: node scripts/check-i18n-parity.mjs
      - name: TypeScript typecheck
        run: npx tsc --project frontend --noEmit

  rust:
    name: Rust (compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The gate is "does the Rust still compile?". `cargo check` is right here:
      # the codebase predates rustfmt + a clean clippy pass, and clippy's
      # correctness lints are deny-by-default, so a clippy/fmt gate would fail on
      # tons of pre-existing issues. `cargo check` only fails on real compile errors
      # — exactly the regressions we keep needing to catch.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check

name: CI

# Quality gate on every push / PR.
#
# It runs `npm run ci` — the SAME chain used locally, all 67 of it — rather than a
# hand-picked handful. It used to run three of those scripts plus tsc, which meant the
# workflow could be green on a commit the real gates would refuse: a Rust-emitted
# translation key missing from both dictionaries, a route served and absent from the app's
# own API panel, a scheduler class no stylesheet defines. All caught locally; none by this
# file.
#
# `check-dev-toggles` is first in that chain for a reason: it is what refuses a commit that
# ships the developer's localhost-pointing BetterCommunity config to every user. One got
# through, in this repository, while this workflow was green.
#
# Split into a frontend job (Linux) and the Rust job (Windows — BMM's Tauri target).

on:
  push:
    branches: [main, Tdev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN. Without a block the token gets the repository's default,
# which on an older repository is write-all — handed to every step, including third-party
# actions. Nothing here writes: it checks out, installs and runs the gate chain and cargo test.
#
# Every action is pinned to a full commit SHA with its tag in the comment (SECURITY_SUMMARY §9
# #3): a tag or branch can be moved by whoever controls the action's repository, a SHA cannot.
# `dtolnay/rust-toolchain` used to be referenced by its `stable` BRANCH; pinned, the toolchain
# is named by `toolchain: stable` instead. To bump: `git ls-remote https://github.com/<owner>/
# <repo> refs/tags/<tag>` (peel an annotated tag with `^{}`), read the diff, change both.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (tsc · guard · i18n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # BMM Docs is a gitlink with no .gitmodules entry, so checkout leaves the folder empty and
      # every gate that reads the docs refused ("BMM Docs/docs/reference/mcp.md is missing"):
      # the frontend job had been red on every push since. The docs repo is public; fetch it at
      # exactly the commit this tree pins, so the gates compare against the docs that ship.
      - name: BMM Docs at the pinned commit
        run: |
          sha=$(git ls-files -s "BMM Docs" | awk '{print $2}')
          rm -rf "BMM Docs"
          git clone --quiet --filter=blob:none https://github.com/FreeProject089/BMM-Docs.git "BMM Docs"
          git -C "BMM Docs" checkout --quiet "$sha"
      # The whole chain, not a selection from it. It includes the three that used to be
      # listed here (security-guard, i18n parity, tsc) and sixty-four more — among them
      # check-compiled-fresh, which compares the committed `frontend/js/**` against the
      # TypeScript it comes from and is only meaningful on a clean checkout like this one.
      - name: Gate chain (npm run ci — 67 checks)
        run: npm run ci

  rust:
    name: Rust (compile check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # Still no fmt/clippy gate: this codebase predates both, clippy's correctness lints
      # are deny-by-default, and turning them on would fail on hundreds of pre-existing
      # findings rather than on anything a commit did.
      #
      # `cargo test` IS new. There are 414 of them — the signature scheme, the zip guards,
      # the keyring, the catalogue kinds — and `cargo check` asserts none of it: it proves
      # the code compiles, which is the weakest true statement available.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  # Dependency advisories, blocking (SECURITY_SUMMARY §9, "No dependency audit in CI").
  # .github/scripts/dep-audit.mjs runs the audit and fails on anything not explained in
  # .github/audit-ignore.json — each entry there names the advisory, the folder and the reason it
  # was judged unreachable. A new advisory is a finding: fix the dependency, do not grow the list.
  npm-audit:
    name: npm audit (shipped dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # = `npm audit --omit=dev --audit-level=high`, read from the lockfile (no install needed).
      - name: npm audit --omit=dev (high and critical fail)
        run: node .github/scripts/dep-audit.mjs npm .

  cargo-audit:
    name: cargo audit (src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      # Pinned version, built from its own lockfile. It only reads Cargo.lock and the RustSec
      # database, so Linux audits the Windows app's lockfile as well as Windows would.
      - name: install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit (vulnerabilities fail)
        run: node .github/scripts/dep-audit.mjs cargo src-tauri

[package]
name = "better-mods-manager"
version = "0.9.5"
edition = "2021"

[[bin]]
name = "better-mods-manager"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "custom-protocol", "notification-all", "dialog-open", "dialog-save", "fs-all", "path-all", "window-all", "shell-open", "updater"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
fs_extra = "1"
anyhow = "1"
reqwest = { version = "0.11", features = ["blocking"] }
zip = { version = "0.6", features = ["deflate"] }
lazy_static = "1.4"
backtrace = "0.3"
sysinfo = "0.30"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# it is the default for `tauri build`
custom-protocol = [ "tauri/custom-protocol" ]

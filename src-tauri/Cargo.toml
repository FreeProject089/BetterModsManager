[package]
name = "better-mods-manager"
version = "1.0.0"
edition = "2021"
autobins = false
# Declared here as well as in LICENSE.md and the docs: cargo, crates.io and any tool that
# inspects the manifest read THIS field, and its absence reads as "unlicensed" — the exact
# opposite of what a GPL project wants to communicate.
license = "GPL-3.0-or-later"
authors = ["FreeProject089"]
repository = "https://github.com/FreeProject089"

[[bin]]
name = "better-mods-manager"
path = "src/main.rs"

# Standalone MCP server + CLI (bmm-mcp-server serve / profiles / mods / api …).
#
# It is declared as an [[example]], NOT a [[bin]], on purpose:
#   tauri-bundler harvests every cargo [[bin]] into the installer, but it IGNORES
#   examples. As a [[bin]] this collided with the externalBin sidecar of the same
#   name (binaries/bmm-mcp-server-<triple>.exe) → WiX light.exe LGHT0091
#   "Duplicate symbol 'Component:bmm_mcp_server.exe'" → the MSI failed to bundle.
#
# The binary that SHIPS is the sidecar in tauri.conf.json
# (`externalBin: ["binaries/bmm-mcp-server"]`). It is self-contained
# (`#[path = "../mcp/mod.rs"] mod mcp;`), so building it as an example works
# exactly like the old bin. To (re)build & refresh the shipped sidecar:
#   cargo build --release --example bmm-mcp-server
#   copy target\release\examples\bmm-mcp-server.exe binaries\bmm-mcp-server-x86_64-pc-windows-msvc.exe
[[example]]
name = "bmm-mcp-server"
path = "src/extra_tools/mcp_server.rs"


[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = "0.4"
embed-resource = "2"

[dependencies]
# Tauri v2 — capabilities replace the allowlist; per-feature flags (dialog/fs/shell/
# notification/path/window/cli/protocol-asset) move into separate plugins below.
# "devtools" still enables the WebView2 inspector in RELEASE builds.
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-cli = "2"
tauri-plugin-process = "2"
open = "5" # open external URLs in the default browser (non-deprecated opener)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
fs_extra = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "stream"] }
# DEFLATE via zlib (libz-sys, builds with cc — no cmake). A modest inflate win over
# the pure-Rust miniz_oxide. NOTE: zlib-ng (the 2-3x SIMD backend) needs cmake to
# build libz-ng-sys, which can't target the installed VS 2026 toolchain — so it is
# intentionally NOT used. Stock codecs (bzip2/zstd/aes/time) kept for parity.
zip = { version = "0.6", default-features = false, features = ["deflate-zlib", "bzip2", "zstd", "aes-crypto", "time"] }
tar = "0.4"
flate2 = "1"
sevenz-rust = "0.6"
unrar = "0.5"
lazy_static = "1.4"
backtrace = "0.3"
sysinfo = "0.30"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
discord-rich-presence = "0.2.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
futures = "0.3"
sha2 = "0.10.9"
# BLAKE3 for fast local content hashing: a tree hash that parallelises WITHIN a
# single large file (mmap + rayon), unlike SHA-256. Used for file_hashes and the
# modpack hash-match index. Repo delta-sync keeps its own SHA-256 (wire format).
blake3 = { version = "1", features = ["rayon", "mmap"] }
warp = "0.3"
local-ip-address = "0.6"
igd = "0.12"
regex = "1"
bytes = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = ["Win32_System_Threading"] }
rand = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
windows-sys = { version = "0.45", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse"] }
percent-encoding = "2.3"
tempfile = "3"
base64 = "0.21"
winreg = "0.52"
rayon = "1.8"
tauri-plugin-single-instance = "2"
jwalk = "0.8"
rmcp = { version = "1.4", features = ["server", "transport-io"] }
schemars = "0.8"
clap = { version = "4", features = ["derive"] }
colored = "2"
comfy-table = "7"
# Use mimalloc — drastically lower RSS on Windows vs the default HeapAlloc.
# Typical gain: 30–60% smaller process working set, plus much less
# fragmentation when many small allocs (string paths, hash entries) are
# allocated and freed during normal BMM use.
mimalloc = { version = "0.1", default-features = false }

# NB: Tauri v2 dropped the `custom-protocol` cargo feature — the production asset
# protocol is handled by the bundler/config, so the old `[features]` block is gone.
